name: Release MCP

# Builds and publishes the chipzen-mcp Python package to PyPI.
#
# Triggers:
#   1. Push of a tag matching `mcp-v*` (e.g. `mcp-v0.1.0`) — the normal
#      release path. Tag should match the version in
#      packages/mcp/pyproject.toml. The `mcp-` prefix keeps this distinct
#      from the chipzen-bot workflow's `python-v*` tags (both packages
#      live in the same repo), matching the repo's per-package
#      `<dir>-v*` convention (python-v*, javascript-v*, rust-v*).
#   2. Manual workflow_dispatch — for first-time releases or
#      emergencies. Use the `dry_run` input to build + upload the
#      artifacts without publishing.
#
# Auth model:
#   PyPI Trusted Publishers (OIDC). No PYPI_TOKEN secret is needed.
#   The trusted publisher must be configured on PyPI before the first
#   real publish — see packages/mcp/RELEASING.md for the one-time
#   setup steps.

on:
  push:
    tags:
      - "mcp-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, don't publish (for inspecting the artifact)."
        type: boolean
        default: false
      target_index:
        description: "Where to publish."
        type: choice
        default: "pypi"
        options:
          - pypi
          - testpypi

# Single in-flight publish per index — avoids racing two parallel
# tag pushes into PyPI (would 409 on the second one anyway, but the
# explicit lock makes the failure mode clearer).
concurrency:
  group: release-mcp-${{ inputs.target_index || 'pypi' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install --upgrade build
      - name: Build sdist + wheel
        working-directory: packages/mcp
        run: python -m build --sdist --wheel --outdir dist/
      - name: Sanity-check produced artifacts
        working-directory: packages/mcp
        run: |
          ls -la dist/
          # Ensure both an sdist (.tar.gz) and a wheel (.whl) were produced.
          test -n "$(ls dist/*.tar.gz 2>/dev/null)" || { echo "::error::no sdist produced"; exit 1; }
          test -n "$(ls dist/*.whl 2>/dev/null)" || { echo "::error::no wheel produced"; exit 1; }
      - name: Upload artifacts for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: chipzen-mcp-dist
          path: packages/mcp/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to ${{ inputs.target_index || 'pypi' }}
    needs: build
    # Skip publish entirely on workflow_dispatch with dry_run=true.
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    environment:
      # The named environment is what PyPI Trusted Publishers binds
      # against — see RELEASING.md. The same env name must be used in
      # the PyPI publisher configuration.
      name: ${{ inputs.target_index || 'pypi' }}
      url: ${{ inputs.target_index == 'testpypi' && 'https://test.pypi.org/p/chipzen-mcp' || 'https://pypi.org/p/chipzen-mcp' }}
    permissions:
      # OIDC token issuance — required for Trusted Publishers.
      id-token: write
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: chipzen-mcp-dist
          path: dist/
      - name: List artifacts
        run: ls -la dist/
      - name: Publish to PyPI
        # SHA pinned to v1.14.0 (https://github.com/pypa/gh-action-pypi-publish).
        # Bump in a single intentional commit when pypa publishes a new release.
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist/
          repository-url: ${{ inputs.target_index == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}
          # A re-run after a downstream (registry) failure must not die on
          # the version already being on PyPI.
          skip-existing: true
          # Defaults from gh-action-pypi-publish v1.14.0+:
          #   verbose: true, print-hash: true

  registry-publish:
    name: Publish to MCP Registry
    needs: publish
    # Only for real PyPI publishes — the official registry validates the
    # PyPI package's ownership marker, so there is nothing to point at on a
    # TestPyPI-only or dry run. Namespace `io.github.chipzen-ai/*` is proven
    # via GitHub Actions OIDC (this repo is owned by the chipzen-ai org), so
    # no secret is stored. The PyPI ownership check reads the
    # `mcp-name: io.github.chipzen-ai/chipzen-mcp` marker from the published
    # package README (see packages/mcp/README.md and server.json).
    if: ${{ inputs.dry_run != true && (inputs.target_index || 'pypi') == 'pypi' }}
    runs-on: ubuntu-latest
    permissions:
      # OIDC token issuance — proves org namespace ownership to the registry.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Read package version
        id: ver
        working-directory: packages/mcp
        run: |
          set -euo pipefail
          version=$(python -c "import json; print(json.load(open('server.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Wait for PyPI to expose the ownership marker
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          marker="mcp-name: io.github.chipzen-ai/chipzen-mcp"
          url="https://pypi.org/pypi/chipzen-mcp/${VERSION}/json"
          for i in $(seq 1 20); do
            desc=$(curl -fsSL "$url" | python -c "import sys,json; print(json.load(sys.stdin)['info'].get('description') or '')" || true)
            if printf '%s' "$desc" | grep -Fq "$marker"; then
              echo "Ownership marker visible on PyPI for ${VERSION}."
              exit 0
            fi
            echo "Marker not visible yet (attempt $i); sleeping 15s..."
            sleep 15
          done
          echo "::error::Ownership marker for ${VERSION} not visible on PyPI after retries."
          exit 1
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
      - name: Publish to the official MCP registry
        working-directory: packages/mcp
        run: |
          set -euo pipefail
          mcp-publisher login github-oidc
          mcp-publisher publish
