name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Lint tooling is pinned exactly, because ruff changes formatter behaviour
  # in minor releases: 0.16 started formatting Python code blocks inside
  # Markdown, which reformatted files no PR had touched and turned
  # `ruff format --check` red on every open PR at once (issue #104). `main`
  # only looked green because its last run predated the release.
  #
  # The two Python packages pin the same version in their `dev` extras, so a
  # contributor's local `ruff` matches CI's. All three must move together --
  # in a deliberate PR that also carries whatever reformatting the new
  # version wants, rather than by surprise on an unrelated change.
  RUFF_VERSION: "0.16.3"

jobs:
  python-sdk:
    # Renamed from `python-starter` (issue #17). The legacy
    # starters/python/ is now a one-page redirect README, so the
    # previous job's `ruff check .` ran against an empty directory
    # and passed vacuously. This job exercises the actual SDK
    # package at packages/python/.
    name: Python SDK (lint + test, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the supported floor and exercises the tomli config-parser
        # fallback (no stdlib tomllib there); 3.12 is the current default.
        # 3.11/3.13 are covered transitively.
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Lint tooling is at the pinned version
        # The pin lives in two places (this workflow's RUFF_VERSION and the
        # package's `dev` extra) and they must agree, or CI and a
        # contributor's local run disagree about what "formatted" means.
        run: |
          installed=$(ruff --version)
          case "$installed" in
            "ruff ${RUFF_VERSION}"*) echo "$installed" ;;
            *) echo "::error::expected ruff ${RUFF_VERSION} (from pyproject dev extra), got: $installed"; exit 1 ;;
          esac
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type-check
        # Static type-check before tests run — catches type errors
        # without needing a full test cycle. The SDK is fully typed
        # (the `Typing :: Typed` classifier in pyproject.toml is the
        # downstream-facing promise this gate keeps honest).
        run: mypy src/
      - name: Test
        # Coverage gate: fails the build if SDK coverage drops below the
        # floor. Demo bots under examples/ are omitted (see pyproject).
        run: pytest -q --cov=chipzen --cov-report=term-missing --cov-fail-under=80

  python-mcp:
    # The MCP server package (packages/mcp) — bridges the External-API
    # remote-play path onto the Model Context Protocol. Mirrors the
    # python-sdk job's gates. The coverage floor (85) landed with the
    # phase-3 runtime wiring; uncovered lines are the stdio entrypoint
    # and the raw urllib transport (both exercised on staging instead).
    name: Python MCP server (lint + test, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Lint tooling is at the pinned version
        run: |
          installed=$(ruff --version)
          case "$installed" in
            "ruff ${RUFF_VERSION}"*) echo "$installed" ;;
            *) echo "::error::expected ruff ${RUFF_VERSION} (from pyproject dev extra), got: $installed"; exit 1 ;;
          esac
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type-check
        run: mypy src/
      - name: Test
        run: pytest -q --cov=chipzen_mcp --cov-report=term-missing --cov-fail-under=85

  python-wheel-smoke:
    # The release workflow publishes a WHEEL, but the rest of CI only ever
    # tests the editable source tree. This job builds the actual wheel and
    # exercises it from a clean venv — proving it installs, imports its
    # public surface, ships the py.typed marker, and exposes its console
    # scripts. (0.3.0 shipped with none of this verified.)
    name: Python wheel smoke-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install --upgrade build
          python -m build
      - name: Install the built wheel in a clean venv and smoke-test it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          # Public surface must import from the INSTALLED wheel, not src/.
          /tmp/smoke/bin/python -c "import chipzen; print('version', chipzen.__version__); from chipzen import Bot, run_bot, run_external_bot, connect_to_chipzen, RetryPolicy, ChipzenConfig, BotDecisionError, load_chipzen_config"
          # The py.typed marker must ship (the Typing :: Typed classifier promises it).
          /tmp/smoke/bin/python -c "import importlib.util, pathlib; origin = importlib.util.find_spec('chipzen').origin; assert origin is not None; assert (pathlib.Path(origin).parent / 'py.typed').exists(), 'py.typed marker missing from the wheel'; print('py.typed OK')"
          # Console scripts resolve.
          /tmp/smoke/bin/chipzen-sdk --help
          /tmp/smoke/bin/chipzen run-external --help

  javascript-sdk:
    # Renamed from `javascript-starter` (issue #17). The previous
    # job only ran `node --check bot.js` against a single starter
    # file. This job runs the actual SDK package's typecheck +
    # build + full vitest suite against packages/javascript/.
    name: JavaScript SDK (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/javascript
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: packages/javascript/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test

  rust-sdk:
    # Renamed from `rust-starter` since the legacy starters/rust/ is
    # now a one-page redirect README. CI now exercises the actual
    # workspace at packages/rust which contains chipzen-bot (the SDK
    # library) and chipzen-sdk (the CLI). The IP-protected starter at
    # packages/rust/starters/rust/ is intentionally NOT in the
    # workspace (so users can copy it standalone) and gets covered by
    # CI once chipzen-bot is published to crates.io.
    name: Rust SDK (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
      - name: Cargo fmt check
        run: cargo fmt --all --check
      - name: Cargo check
        run: cargo check --workspace --all-targets --quiet
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --workspace --quiet

  protocol-doc-mirror:
    # docs/EXTERNAL-API-BOT-PROTOCOL.md is the CANONICAL copy; the private
    # platform repo keeps a mirror of it. They had drifted in both directions
    # (chipzen-ai/Chipzen#3954). This guard hashes a normalized form of the doc
    # and compares it to the digest committed in BOTH repos, so a one-sided edit
    # goes red here (or there) instead of quietly separating the two again.
    name: Protocol doc mirror guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the protocol doc against the committed digest
        run: python scripts/protocol_doc_hash.py --check

  python-starter-image:
    # `docker build -t my-bot .` is the canonical packaging step QUICKSTART.md
    # tells every Python bot author to run, and nothing in CI ever ran it. Both
    # halves of issue #74 were therefore invisible here: the pinned base digest
    # had been garbage-collected off Docker Hub (404 before the first layer),
    # and the Cython stage had no C toolchain to compile the generated C with.
    #
    # This job builds the shipped starter exactly as a user would and then
    # imports the compiled module out of the runtime image, which proves the
    # .so is loadable and that `from bot import main` — the image ENTRYPOINT —
    # resolves. A stale digest or a missing build dep now reds a PR instead of
    # reaching a developer's first five minutes with the SDK.
    name: Python starter image (docker build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python/starters/python
    steps:
      - uses: actions/checkout@v4
      - name: Build the starter image
        run: docker build -t chipzen-starter:ci .
      - name: The runtime image runs the COMPILED bot, with no .py source
        run: |
          set -euo pipefail
          cat > /tmp/check.py <<'PY'
          import os

          import bot

          assert bot.__file__.endswith(".so"), bot.__file__
          assert callable(bot.main), "the image ENTRYPOINT calls bot.main()"
          leaked = [f for f in os.listdir("/bot") if f.endswith(".py")]
          assert not leaked, f"strategy source leaked into the runtime image: {leaked}"
          print("compiled module OK:", bot.__file__)
          PY
          # PYTHONPATH=/bot because the script is mounted outside the bot's
          # WORKDIR, so sys.path[0] would otherwise be /tmp.
          docker run --rm \
            -v /tmp/check.py:/tmp/check.py \
            -e PYTHONPATH=/bot \
            --entrypoint python chipzen-starter:ci /tmp/check.py

  reference-bot:
    name: Reference bot (lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/reference-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        # Pinned via the workflow-level RUFF_VERSION — this job has no
        # pyproject to carry the pin, and an unpinned install here is what
        # let ruff 0.16 red the repo (issue #104).
        run: pip install "ruff==${RUFF_VERSION}"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
